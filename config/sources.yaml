# 资讯源清单
# track: game = 命中即推（每日） / controller = 进待发池，攒满再发
# tier: 1 = 主力，2 = 补充。tier 仅用于简报内的排序，不影响筛选
# 源地址于 2026-08-30 逐个实测；失效源请置 enabled: false 而非删除，保留记录

sources:
  # ---- 第一梯队：覆盖主机 + PC + 中文 + 产业数据 ----
  - id: gematsu
    name: Gematsu
    url: "https://www.gematsu.com/feed"
    track: game
    tier: 1
    lang: en
    enabled: true
    note: 日厂与主机向，首发预告、实机、发售日，更新极密

  - id: vgc
    name: VGC
    url: "https://www.videogameschronicle.com/feed/"
    track: game
    tier: 1
    lang: en
    enabled: true
    note: 欧美主机新闻与产业，硬件政策最快

  - id: gcores
    name: 机核 GCORES
    url: "https://www.gcores.com/rss"
    track: game
    tier: 1
    lang: zh
    enabled: true
    note: 中文深度、展会现场、产业观察

  - id: gamesindustry
    name: GamesIndustry.biz
    url: "https://www.gamesindustry.biz/feed"
    track: game
    tier: 1
    lang: en
    enabled: true
    note: 产业数据与商业动态。注意 /feed/rss 与 /rss 均已 404，只能用 /feed

  # ---- 第二梯队：按需要覆盖 ----
  - id: pcgamer
    name: PC Gamer
    url: "https://www.pcgamer.com/rss/"
    track: game
    tier: 2
    lang: en
    enabled: true
    note: PC 硬件与优化，与适配类内容最对口

  - id: rps
    name: Rock Paper Shotgun
    url: "https://www.rockpapershotgun.com/feed"
    track: game
    tier: 2
    lang: en
    enabled: true

  - id: eurogamer
    name: Eurogamer
    url: "https://www.eurogamer.net/feed"
    track: game
    tier: 2
    lang: en
    enabled: true

  - id: nintendolife
    name: Nintendo Life
    url: "https://www.nintendolife.com/feeds/latest"
    track: game
    tier: 2
    lang: en
    enabled: true
    note: Switch 与 Switch 2 生态，兼容性消息

  - id: psblog
    name: PlayStation Blog
    url: "https://blog.playstation.com/feed/"
    track: game
    tier: 2
    lang: en
    enabled: true
    note: PS 官方第一手，配件与系统更新

  - id: xboxera
    name: XboxEra
    url: "https://xboxera.com/feed/"
    track: game
    tier: 2
    lang: en
    enabled: true

  - id: steamnews
    name: Steam 官方博客
    url: "https://store.steampowered.com/feeds/news/"
    track: game
    tier: 2
    lang: en
    enabled: true
    note: 平台政策与控制器支持变动

  - id: chuapp
    name: 触乐
    url: "https://www.chuapp.com/feed"
    track: game
    tier: 2
    lang: zh
    enabled: true

  - id: nintendoeverything
    name: Nintendo Everything
    url: "https://nintendoeverything.com/feed/"
    track: game
    tier: 2
    lang: en
    enabled: true

  # ---- 已失效 / 被拦截：保留记录，默认关闭 ----
  # Cloudflare 拦脚本与云端 IP，实测 403。阅读器（有 UA 与 IP 信誉）可能可用，但
  # GitHub Actions 的 IP 信誉更差，故默认关闭。不值得为它引入 RSSHub 这一额外依赖点。
  - id: purexbox
    name: Pure Xbox
    url: "https://purexbox.com/feed"
    track: game
    tier: 2
    lang: en
    enabled: false
    note: 实测 403

  - id: xboxwire
    name: Xbox Wire
    url: "https://news.xbox.com/en-us/feed/"
    track: game
    tier: 2
    lang: en
    enabled: false
    note: 实测 403

  - id: pcgamesn
    name: PCGamesN
    url: "https://www.pcgamesn.com/feed"
    track: game
    tier: 2
    lang: en
    enabled: false
    note: 实测 403

  # ---- 赛事与电竞：2026-08-30 实测新增 ----
  - id: esportsinsider
    name: Esports Insider
    url: "https://esportsinsider.com/feed"
    track: esports
    tier: 2
    lang: en
    enabled: true
    note: 电竞产业与赛事商业动态，选手与战队消息

  - id: hltv
    name: HLTV
    url: "https://www.hltv.org/rss/news"
    track: esports
    tier: 2
    lang: en
    enabled: true
    note: CS2 赛事第一手，更新频率高于综合电竞站

  # ---- 赛事赛程：Liquipedia 各 wiki（2026-08-30 实测）----
  # Liquipedia 是 MediaWiki，可直接订阅任意 wiki 的页面变更。它比主办方官方源更全：
  # BLAST、PGL、ESL 的赛程都在里面，而这些主办方官网都没 RSS。
  # 代价是噪音偏高——页面微调也会进 feed，靠模型打分过滤。tier 3 即表示噪音偏高。
  # ---- Liquipedia：全部关闭（2026-08-30 实测后放弃）----
  # 技术上可用：MediaWiki 架构，feedrecentchanges 能订阅任意 wiki，200 且更新及时，
  #   BLAST、PGL、Capcom Pro Tour 的赛程页面都在里面。
  # 但内容上不可用：feed 每条只有页面名 + 一句 "Show changes"，没有任何实质信息。
  #   模型给这些条目打 0 分是完全正确的——没有事实可提取，也推导不出落点。
  # 真要用它的赛程数据，得走 Liquipedia API v3（api.liquipedia.net/api/v3/match）
  #   拿结构化赛程，需要申请 API Key，是另一个量级的工程。
  - id: lq_fighters
    name: Liquipedia 格斗
    url: "https://liquipedia.net/fighters/api.php?action=feedrecentchanges&feedformat=rss&namespace=0&limit=20"
    track: esports
    tier: 3
    lang: en
    enabled: false
    note: feed 无实质内容，仅页面名与 Show changes

  - id: lq_simracing
    name: Liquipedia 模拟赛车
    url: "https://liquipedia.net/simracing/api.php?action=feedrecentchanges&feedformat=rss&namespace=0&limit=20"
    track: esports
    tier: 3
    lang: en
    enabled: false
    note: 同上，feed 无实质内容

  - id: lq_apex
    name: Liquipedia Apex
    url: "https://liquipedia.net/apexlegends/api.php?action=feedrecentchanges&feedformat=rss&namespace=0&limit=20"
    track: esports
    tier: 3
    lang: en
    enabled: false
    note: 同上，feed 无实质内容

  - id: lq_cs2
    name: Liquipedia CS2
    url: "https://liquipedia.net/counterstrike/api.php?action=feedrecentchanges&feedformat=rss&namespace=0&limit=20"
    track: game
    tier: 3
    lang: en
    enabled: false
    note: CS2 是键鼠项目，对手柄品牌无内容落点；且 HLTV 已覆盖赛果。实测跑了一轮，
      16 条全部被模型判低分、一条没进简报，只是增加抓取量与噪音，故关闭

  - id: iracing
    name: iRacing 官方
    url: "https://www.iracing.com/feed/"
    track: game
    tier: 2
    lang: en
    enabled: true
    note: 官方赛季与赛事公告，eNASCAR 等

  # ---- 实测可用但主动放弃 ----
  # Liquipedia 的 dota2 / leagueoflegends / valorant / rocketleague 四个 wiki 同样可用
  #   （实测 200，内容为 TI 2026、World Championship 等），但都是键鼠主导项目，
  #   对手柄品牌几乎没有内容落点，只会增加噪音。做键鼠外设时再启用。
  # pro.eslgaming.com/feed 实测返回 200，但内容是赌场广告与咖啡店文章，
  #   域名已被 SEO 垃圾占领，绝对不能用——这是"必须实测再上线"的证据。
  # 其他实测不可用：BLAST 官网 404、PGL 530、EVO 官网 404、EA 新闻 404、
  #   GT Planet 403、Epic 商城 403、八位堂官网 404、Shoryuken SSL 错误、EventHubs 超时。

  - id: gamespot
    name: GameSpot
    url: "https://www.gamespot.com/feeds/news/"
    track: game
    tier: 2
    lang: en
    enabled: true
    note: 综合大站，用于补充条目基数，噪音中等

# 实测可用但主动放弃的源（保留判断依据，避免以后重复试错）
# Automaton https://automaton-media.com/feed/ ：60 条且更新到当天，但全日文。
#   日文标题混进中文简报会拖慢扫读；日厂动向 VGC 与 Gematsu 已用英文覆盖。做日本市场时再启用。
# GamesRadar https://www.gamesradar.com/rss/ ：50 条，但量大偏浅、攻略型居多，属噪音源。
# VG247 https://www.vg247.com/feed ：HTTP 200 但最新内容停在 2026-06-02，是死源。
# 中文站全灭（2026-08-30 实测）：游民星空、3DMGAME、A9VG、篝火营地、游戏时光、玩加电竞均 404。
#   Dot Esports、Dexerto、Push Square、Siliconera、Time Extension、Nintendo Wire 均 403。

# 抓取行为
fetch:
  timeout_seconds: 25       # Steam 官方博客实测 15 秒会超时
  max_workers: 8
  window_hours: 24        # 只保留最近 24 小时发布的条目
  user_agent: "Mozilla/5.0 (compatible; GameSirBrief/1.0; +https://github.com/)"

# 源健康检查：连续失败多少次后自动降级并告警
health:
  fail_threshold: 3
