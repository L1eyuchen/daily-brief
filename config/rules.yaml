# 筛选规则
# 设计原则：blacklist 只拦明确不要的；triggers 做的是"打标"不是"过滤"——
# 命中任一触发器即进简报，一条都没命中才丢弃。宁可多进一条，不可漏一条。

# ---- 硬黑名单：命中即丢弃。保持克制，误伤代价高于漏筛代价 ----
blacklist:
  - mobile
  - ios
  - android
  - app store
  - google play
  - gacha
  - 手游
  - 抽卡
  - 内购
  - 小程序

# ---- 关注名单：不看通用关键词，直接点名值得盯的 IP 与厂商 ----
